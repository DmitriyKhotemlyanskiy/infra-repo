apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/DmitriyKhotemlyanskiy/infra-repo'
    targetRevision: main
    path: kubernetes/frontend
    directory:
      recurse: true 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev-project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
