apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 55.5.0 # actual chart version
    helm:
      releaseName: kube-prometheus-stack
      values: |
        grafana:
          adminPassword: "admin"
        prometheus:
          prometheusSpec:
            # Allow to scrape ServiceMonitor from all namespaces
            serviceMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                memory: "300Mi"
                cpu: "100m"
              limits:
                memory: "1Gi"
        # Desable NodeExporter for mac os 
        nodeExporter:
          enabled: false
        prometheus-node-exporter:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # ArgoCD creates namespace monitoring by it self