apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app-deployment
  namespace: dev-project
  labels:
    app: frontend-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
        - name: frontend-app
          image: dimakhot/frontend-py3-app:59cad164f1ce658957bb90f760210a4ae75bf8a1
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-configmap
                  key: API_URL
