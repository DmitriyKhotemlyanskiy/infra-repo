apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init-replica
  namespace: dev-project
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    metadata:
      labels:
        app: mongo-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-replica
        image: mongo:7.0
        command:
        - "bash"
        - "-c"
        - |
          echo "Waiting for MongoDB pods to start..."
          sleep 15

          echo "Checking if replica set is already initialized..."
          mongosh --host mongo-stateful-set-0.mongodb-headless.dev-project.svc.cluster.local:27017 --eval "
            try {
              rs.status();
              print('Replica set already initialized.');
            } catch (e) {
              print('Initializing replica set...');
              rs.initiate({
                _id: 'rs0',
                members: [
                  { _id: 0, host: 'mongo-stateful-set-0.mongodb-headless.dev-project.svc.cluster.local:27017' },
                  { _id: 1, host: 'mongo-stateful-set-1.mongodb-headless.dev-project.svc.cluster.local:27017' },
                  { _id: 2, host: 'mongo-stateful-set-2.mongodb-headless.dev-project.svc.cluster.local:27017' }
                ]
              });
            }
          "

          echo "Waiting for PRIMARY to be elected..."
          until mongosh --host mongo-stateful-set-0.mongodb-headless.dev-project.svc.cluster.local:27017 --quiet --eval "rs.isMaster().ismaster" | grep -q "true"; do
            sleep 5
            echo "Waiting for primary..."
          done

          echo "Creating or updating root user..."
          mongosh --host mongo-stateful-set-0.mongodb-headless.dev-project.svc.cluster.local:27017 --eval "
            use admin;
            try {
              db.createUser({
                user: 'username',
                pwd: 'password',
                roles: [{ role: 'root', db: 'admin' }]
              });
              print('User created successfully.');
            } catch (e) {
              if (e.codeName === 'DuplicateKey') {
                print('User already exists, updating password...');
                db.changeUserPassword('username', 'password');
                print('Password updated successfully.');
              } else {
                throw e;
              }
            }
          "
          echo "Mongo initialization completed successfully!"