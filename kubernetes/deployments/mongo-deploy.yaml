apiVersion: v1
kind: Namespace
metadata:
  name: dev-project

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  namespace: dev-project
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: arm64v8/mongo:8-noble
          ports:
            - containerPort: 27017
          env:
          - name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: mongodb-secret
                key: mongo-root-username
          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mongodb-secret
                key: mongo-root-password
          resources:
            limits:
              memory: "512Mi"
              cpu: "300m"
          volumeMounts:
            - name: mongo-data    #same name from volumes.name in this file
              mountPath: /data/db #where data is saved into container
              subPath: mongodb    #where data is saved on your host machine
      volumes:
        - name: mongo-data        
          persistentVolumeClaim:
            claimName: mongo-pvc  #name from mongo-pesristent-volume-claim.yaml
